# Copy this file to config.local.toml and edit it.
# config.local.toml is git-ignored, so your changes stay on your machine.

[search]
budget_min = 15000
budget_max = 22000
# Also show cars this far outside the budget, flagged, since prices are negotiable.
# 0.10 means 10%: with the budget above, cars from $13,500 to $24,200 are shown.
budget_stretch = 0.10
# Title status. "no_branded" drops cars whose ad says rebuilt, salvage or
# branded, and flags ads that don't say. "clean_only" also drops ads that
# don't state a clean title. "any" keeps everything and only flags.
title = "no_branded"
min_year = 2013
max_year = 2026
# Allowed: "GR86", "GT86", "Toyota 86", "BRZ", "FR-S"
models = ["GR86", "GT86", "Toyota 86", "BRZ", "FR-S"]

[location]
# Provinces to keep. Listings tagged with any other province are filtered out.
allowed_provinces = ["BC"]
# Used only when an email shows no province for a listing.
bc_cities = [
  "Victoria", "Saanich", "Langford", "Colwood", "Sidney", "Sooke",
  "Nanaimo", "Duncan", "Courtenay", "Comox", "Campbell River", "Parksville",
  "Port Alberni", "Vancouver", "Burnaby", "Richmond", "Surrey", "Delta",
  "Langley", "Coquitlam", "Port Coquitlam", "New Westminster",
  "North Vancouver", "West Vancouver", "Maple Ridge", "Abbotsford",
  "Chilliwack", "Mission", "White Rock", "Squamish", "Whistler", "Kelowna",
  "West Kelowna", "Vernon", "Kamloops", "Penticton", "Salmon Arm",
  "Prince George", "Nelson", "Cranbrook", "Revelstoke", "Terrace",
  "Prince Rupert", "Fort St. John",
]

[email]
# The Gmail search the skill runs to find alert emails.
gmail_query = "from:facebookmail.com newer_than:3d"

[valuation]
# Cars usually sell for a bit less than the asking price. 0.05 means 5%.
sale_discount = 0.05
# How long you plan to keep the car before selling it, in years.
hold_years = 1.5
# How many km you expect to drive per year.
km_per_year = 12000
# Call it a Buy when the asking price is this share of similar cars or lower.
buy_threshold = 0.93
# Call it a Pass when the asking price is this share of similar cars or higher.
pass_threshold = 1.10
# Listings older than this many days get a lower suggested offer.
stale_days = 30
# Fewest comps needed before the tool gives value estimates.
min_comps = 12
# Ignore comps not seen in this many days.
comps_max_age_days = 60
